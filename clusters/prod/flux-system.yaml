# Bootstrap objects for a future `prod` cluster — NOT deployed anywhere yet
# (D-26: prod is deliberately deferred until Q-DR and #90 land at M6, see the
# code repo's infra/helm/beekeepingit/environments/prod.yaml header). Prepared
# now, mirroring clusters/staging/flux-system.yaml exactly, so prod's eventual
# bring-up starts from the already-fixed pattern instead of rediscovering
# staging's bugs from scratch. Inert Git state until someone runs the one-time
# `kubectl apply -f clusters/prod/` bootstrap against a real prod cluster.
#
# TWO GitRepository sources (D-27/ADR-0018 repo split): MANIFESTS from this
# beekeepingit-gitops repo (that source tracks `main`); CHART from the
# beekeepingit code repo (that source is pinned to a release tag and moves via
# release-deploy.yml's promotion PR — or its `git revert` for a rollback,
# ADR-0018 addendum; today's value is the #14 placeholder, prod being inert).
# scripts/check-chart-pin.sh enforces the pin in CI (beekeepingit#611).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: beekeepingit-gitops
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/TiagoJVO/beekeepingit-gitops
  ref:
    branch: main
---
# Chart source: apps/prod/beekeepingit-helmrelease.yaml references this by name
# for `chart: ./infra/helm/beekeepingit` in the code repo.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: beekeepingit
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/TiagoJVO/beekeepingit
  ref:
    # Pinned to a RELEASE, never a branch: `chart.spec.version` is ignored for a
    # git source, so this ref is the only thing pinning chart content. On `main`,
    # every merge re-rendered the chart onto the cluster ungated. Bumped by
    # release-deploy.yml's promotion PR (beekeepingit ADR-0018 addendum).
    tag: v0.0.1-rc11
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: beekeepingit-gitops
  path: ./clusters/prod
  prune: true
