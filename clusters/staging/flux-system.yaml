# Bootstrap objects for the `staging` cluster (Scaleway Kapsule, D-26): where
# Flux pulls from, and the self-referential Kustomization that keeps everything
# under clusters/staging/ (including this file) reconciled from Git. See
# README.md for the one-time `kubectl apply` bootstrap step; clusters/dev/
# flux-system.yaml has the same shape but deliberately tracks `main` for the
# chart (dev is the pre-release loop, never a release-deploy target).
#
# TWO GitRepository sources (D-27/ADR-0018 repo split): the MANIFESTS
# (clusters/, apps/) live in this beekeepingit-gitops repo and that source
# tracks `main`; the Helm CHART is sourced from the beekeepingit code repo and
# that source is pinned to a release tag, which moves via release-deploy.yml's
# promotion PR — or its `git revert` for a rollback (ADR-0018 addendum).
# scripts/check-chart-pin.sh enforces the pin in CI (beekeepingit#611).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: beekeepingit-gitops
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/TiagoJVO/beekeepingit-gitops
  ref:
    branch: main
---
# Chart source: apps/staging/beekeepingit-helmrelease.yaml references this by
# name for `chart: ./infra/helm/beekeepingit` in the code repo.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: beekeepingit
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/TiagoJVO/beekeepingit
  ref:
    # Pinned to a RELEASE, never a branch: `chart.spec.version` is ignored for a
    # git source, so this ref is the only thing pinning chart content. On `main`,
    # every merge re-rendered the chart onto the cluster ungated. Bumped by
    # release-deploy.yml's promotion PR (beekeepingit ADR-0018 addendum).
    tag: v0.0.1-rc14
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: beekeepingit-gitops
  path: ./clusters/staging
  prune: true
